# İlk kurulumda kullanılır — Let's Encrypt sertifikası alınmadan önce
# SSL kurulduktan sonra bu dosyayı silin, default.conf'u aktif edin
server {
    listen 80;
    server_name mabridgeglobal.com www.mabridgeglobal.com;

    # certbot webroot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    client_max_body_size 20m;

    location /api/ {
        proxy_pass         http://backend:5000/api/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://backend:5000/uploads/;
    }

    location /admin/ {
        proxy_pass http://admin/;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://frontend/;
        proxy_set_header Host $host;
    }
}
